name: Build Evolution X (raphael) - AOD battery chip fix

# GitHub-hosted runner (public repo -> free; 6 h/job, 4 cores, 16 GB RAM).
# A full AOSP tree is heavy on 16 GB, so keep memory low: -j1 sync, single git
# pack thread, swapfile, then build only the SystemUI module (carries the fix).
on:
  workflow_dispatch:
    inputs:
      fix_branch:
        description: 'fork branch carrying the SystemUI fix'
        default: 'fix/aod-battery-chip-text-size'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space + add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/microsoft
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af || true
          sudo fallocate -l 16G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -h ; df -h /

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Init + sync Evolution X (cnb, -j1, low memory, retries)
        run: |
          git config --global http.postBuffer 524288000
          git config --global core.compression 0
          git config --global pack.threads 1
          git config --global pack.windowMemory 64m
          git config --global pack.deltaCacheSize 32m
          git config --global advice.detachedHead false
          mkdir -p "$HOME/aosp" && cd "$HOME/aosp"
          if [ ! -d .repo ]; then
            repo init -u https://github.com/Evolution-X/manifest -b cnb \
                      --no-clone-bundle --no-tags
          fi
          ok=0
          for i in 1 2 3 4 5 6; do
            echo "=== sync attempt $i ==="
            if nice -n 5 repo sync -c -j1 --force-sync --no-clone-bundle --no-tags; then ok=1; break; fi
            echo "attempt $i failed; retrying"
            sleep 20
          done
          [ "$ok" = 1 ] || { echo "sync failed after retries"; exit 1; }
          df -h . ; du -sh .repo 2>/dev/null || true

      - name: Apply the AOD battery chip fix
        run: |
          set -e
          cd "$HOME/aosp/frameworks/base"
          git fetch https://github.com/Csiebe84/frameworks_base "${{ github.event.inputs.fix_branch }}"
          git cherry-pick FETCH_HEAD

      - name: Build SystemUI (compiles the fix)
        run: |
          set -e
          cd "$HOME/aosp"
          source build/envsetup.sh
          lunch lineage_raphael-cnb-user
          nice -n 5 mka SystemUI -j2
          find out -name 'SystemUI.apk' -exec ls -l {} \; || true
