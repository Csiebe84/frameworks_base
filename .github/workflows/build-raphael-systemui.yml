name: Build Evolution X (raphael) - AOD battery chip fix

# Manual trigger only. Needs a self-hosted runner with >=12 cores / 64 GB RAM /
# ~300 GB free disk (a full AOSP tree does NOT fit GitHub-hosted runners).
on:
  workflow_dispatch:
    inputs:
      fix_branch:
        description: 'fork branch carrying the SystemUI fix'
        default: 'fix/aod-battery-chip-text-size'
        required: true

jobs:
  build:
    runs-on: [self-hosted, linux, x64, aosp]
    timeout-minutes: 720
    steps:
      - name: Prep workspace (SSD, never /tmp)
        run: |
          set -e
          mkdir -p "$HOME/aosp"
          cd "$HOME/aosp"
          df -h .

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Init + sync Evolution X (cnb)
        run: |
          set -e
          cd "$HOME/aosp"
          if [ ! -d .repo ]; then
            repo init -u https://github.com/Evolution-X/manifest -b cnb --git-lfs
          fi
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags

      - name: Apply the AOD battery chip fix
        run: |
          set -e
          cd "$HOME/aosp/frameworks/base"
          git fetch https://github.com/Csiebe84/frameworks_base "${{ github.event.inputs.fix_branch }}"
          git cherry-pick FETCH_HEAD

      - name: Build SystemUI (fast check) then the full ROM
        run: |
          set -e
          cd "$HOME/aosp"
          source build/envsetup.sh
          lunch lineage_raphael-cnb-user
          mka SystemUI -j"$(nproc)"
          mka bacon -j"$(nproc)"

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: EvolutionX-raphael-ota
          path: ${{ env.HOME }}/aosp/out/target/product/raphael/*.zip
          if-no-files-found: warn
