name: Build Evolution X (raphael) - AOD battery chip fix

# Runs on a GitHub-hosted runner (free for public repos, 6 h max, 4 cores /
# 16 GB RAM / ~88 GB disk). The build is memory/disk/time constrained, so the
# workflow frees disk first and builds SystemUI (the module that carries the
# fix) rather than the whole ROM.
on:
  workflow_dispatch:
    inputs:
      fix_branch:
        description: 'fork branch carrying the SystemUI fix'
        default: 'fix/aod-battery-chip-text-size'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af || true
          df -h /

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Init + sync Evolution X (cnb, shallow + partial)
        run: |
          set -e
          mkdir -p "$HOME/aosp" && cd "$HOME/aosp"
          repo init -u https://github.com/Evolution-X/manifest -b cnb \
                    --depth=1 --partial-clone --clone-filter=blob:limit=10M
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags --fail-fast
          df -h . ; du -sh .repo

      - name: Apply the AOD battery chip fix
        run: |
          set -e
          cd "$HOME/aosp/frameworks/base"
          git fetch --depth=1 https://github.com/Csiebe84/frameworks_base "${{ github.event.inputs.fix_branch }}"
          git cherry-pick FETCH_HEAD

      - name: Build SystemUI (compiles the fix)
        run: |
          set -e
          cd "$HOME/aosp"
          source build/envsetup.sh
          lunch lineage_raphael-cnb-user
          mka SystemUI -j"$(nproc)"
          ls -l out/target/product/raphael/system/system_ext/priv-app/SystemUI/ 2>/dev/null || true
          find out -name 'SystemUI.apk' -exec ls -l {} \; || true
