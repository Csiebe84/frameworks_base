name: Build Evolution X (raphael) - AOD battery chip fix

# GitHub-hosted runner (public repo -> free; 6 h/job, 4 cores, 16 GB RAM,
# ~88 GB free disk after cleanup). A full AOSP tree is heavy for this runner,
# so: add a swapfile, sync shallow+partial with low parallelism, then build
# the SystemUI module (which carries the fix).
on:
  workflow_dispatch:
    inputs:
      fix_branch:
        description: 'fork branch carrying the SystemUI fix'
        default: 'fix/aod-battery-chip-text-size'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Free disk space + add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /opt/microsoft
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune -af || true
          # 16 GB swapfile -> absorb peak memory of parallel git/Soong.
          sudo fallocate -l 16G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile && sudo swapon /mnt/swapfile
          free -h ; df -h /

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Init + sync Evolution X (cnb, shallow + partial, -j2)
        run: |
          set -e
          git config --global http.postBuffer 524288000
          git config --global core.compression 0
          mkdir -p "$HOME/aosp" && cd "$HOME/aosp"
          repo init -u https://github.com/Evolution-X/manifest -b cnb \
                    --depth=1 --partial-clone --clone-filter=blob:limit=10M --no-clone-bundle
          repo sync -c -j2 --force-sync --no-clone-bundle --no-tags --fail-fast --quiet || repo sync -c -j2 --force-sync --no-clone-bundle --no-tags --fail-fast
          df -h . ; du -sh .repo 2>/dev/null || true

      - name: Apply the AOD battery chip fix
        run: |
          set -e
          cd "$HOME/aosp/frameworks/base"
          git fetch --depth=1 https://github.com/Csiebe84/frameworks_base "${{ github.event.inputs.fix_branch }}"
          git cherry-pick FETCH_HEAD

      - name: Build SystemUI (compiles the fix)
        run: |
          set -e
          cd "$HOME/aosp"
          source build/envsetup.sh
          lunch lineage_raphael-cnb-user
          mka SystemUI -j2
          find out -name 'SystemUI.apk' -exec ls -l {} \; || true
